<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Брзочитач</title>
<style>
:root{
  --bg:#12151c;
  --panel:#171b24;
  --panel-2:#1d222d;
  --line:#2a3140;
  --ink:#e9e6df;
  --ink-dim:#9aa3b2;
  --ink-faint:#5c6577;
  --rubric:#e0524a;      /* киновар – боја рубрике у старим рукописима */
  --band:#232b3a;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", "PT Serif", serif;
}
body.svetlo{
  --bg:#efe9db;
  --panel:#e6dfcd;
  --panel-2:#ded6c1;
  --line:#cdc3a9;
  --ink:#25211a;
  --ink-dim:#5f594c;
  --ink-faint:#8c8474;
  --band:#dcd2b8;
  --rubric:#a8291f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ui);
  overflow:hidden;
}
button,select,input{font-family:inherit;color:inherit}

/* ---------- распоред ---------- */
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}

/* ---------- библиотека ---------- */
.biblio{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.biblio h1{
  font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  margin:0;padding:18px 16px 14px;color:var(--ink-dim);font-weight:600;
  border-bottom:1px solid var(--line);
}
.biblio h1 b{color:var(--rubric);font-weight:600}
.lista{overflow-y:auto;flex:1;padding:8px 0;min-height:0}
.poruka-ucitavanje{padding:14px 16px;color:var(--ink-faint);font-size:13px;line-height:1.6}
.stavka{
  display:block;width:100%;text-align:left;background:none;border:0;
  padding:10px 16px;cursor:pointer;border-left:3px solid transparent;
}
.stavka:hover{background:var(--panel-2)}
.stavka.aktivna{background:var(--panel-2);border-left-color:var(--rubric)}
.stavka .n{display:block;font-size:14px;line-height:1.3}
.stavka .m{display:block;font-size:11px;color:var(--ink-faint);margin-top:3px}
.stavka .x{
  float:right;color:var(--ink-faint);border:0;background:none;cursor:pointer;
  font-size:14px;line-height:1;padding:2px 4px;
}
.stavka .x:hover{color:var(--rubric)}
.biblio-dno{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}

/* ---------- дугмад ---------- */
.dug{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:8px 12px;border-radius:3px;cursor:pointer;font-size:13px;
}
.dug:hover{border-color:var(--ink-faint)}
.dug.glavno{background:var(--rubric);border-color:var(--rubric);color:#fff;font-weight:600}
.dug.glavno:hover{filter:brightness(1.1)}
.dug:focus-visible,.stavka:focus-visible,select:focus-visible,input:focus-visible{
  outline:2px solid var(--rubric);outline-offset:2px
}

/* ---------- главна страна ---------- */
.glavno-okno{display:flex;flex-direction:column;min-width:0;min-height:0}

.alatke{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);
}
.grupa{display:flex;align-items:center;gap:8px}
.grupa label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-faint)}
select,input[type=number]{
  background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:5px 7px;font-size:13px;
}
input[type=range]{accent-color:var(--rubric);width:150px}
.brzina-broj{font-variant-numeric:tabular-nums;font-size:15px;min-width:52px;font-weight:600}
.naslov-tekuci{
  flex:1;text-align:right;color:var(--ink-dim);font-size:13px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;
}

/* ---------- фокус (RSVP) ---------- */
.fokus{
  position:relative;background:var(--panel);border-bottom:1px solid var(--line);
  padding:34px 20px;flex:0 0 auto;
}
.merilo{max-width:900px;margin:0 auto;position:relative}
.merilo::before,.merilo::after{
  content:"";position:absolute;left:50%;width:1px;height:12px;background:var(--ink-faint);
}
.merilo::before{top:-14px}
.merilo::after{bottom:-14px}
.red{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;
  font-family:var(--ui);font-weight:600;font-size:46px;line-height:1.25;
}
.red .l{text-align:right}
.red .r{text-align:left}
.red .p{color:var(--rubric)}
.red.grupa-rec{display:block;text-align:center}

/* ---------- текст ---------- */
.citaonica{
  flex:1;overflow-y:auto;position:relative;padding:36px 0 45vh;min-height:0;
}
.tekst{
  max-width:44em;margin:0 auto;padding:0 24px;
  font-family:var(--serif);font-size:19px;line-height:1.85;color:var(--ink-dim);
}
.tekst p{margin:0 0 1.15em}
.rec{cursor:pointer;border-radius:2px;padding:1px 0}
.rec.procitana{color:var(--ink-faint)}
.rec.tekuca{background:var(--band);color:var(--ink);box-shadow:0 0 0 3px var(--band)}
input[type=checkbox]{accent-color:var(--rubric);width:16px;height:16px}

/* режими приказа */
body.rezim-tekst .fokus{display:none}
body.rezim-fokus .citaonica{display:none}
body.rezim-fokus .fokus{flex:1;display:flex;align-items:center;justify-content:center}
body.rezim-fokus .merilo{width:100%}
body.rezim-fokus .red{font-size:64px}

/* ---------- подножје ---------- */
.podnozje{
  border-top:1px solid var(--line);background:var(--panel);
  padding:10px 20px 12px;display:flex;align-items:center;gap:16px;
}
.traka{flex:1;accent-color:var(--rubric);width:auto}
.stanje{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.svirac{display:flex;gap:6px}
.svirac .dug{min-width:40px;text-align:center}

/* ---------- унос текста ---------- */
.zavesa{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:10;
}
.zavesa.otvorena{display:flex}
.prozor{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;
  width:min(720px,100%);padding:20px;display:grid;gap:12px;
}
.prozor h2{margin:0;font-size:15px;font-weight:600}
.prozor input[type=text],.prozor textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);
  border-radius:3px;padding:9px;font-size:14px;
}
.prozor textarea{min-height:240px;resize:vertical;font-family:var(--serif);line-height:1.6}
.prozor .red-dugmadi{display:flex;gap:8px;justify-content:flex-end}
.pomoc{font-size:12px;color:var(--ink-faint);line-height:1.6}
kbd{
  background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:3px;padding:1px 5px;font-size:11px;font-family:var(--ui);
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .biblio{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}
  .red{font-size:34px}
  body.rezim-fokus .red{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body class="rezim-oba">

<div class="app">

  <!-- ================= БИБЛИОТЕКА ================= -->
  <aside class="biblio">
    <h1>Брзо<b>читач</b></h1>
    <div class="lista" id="lista"><div class="poruka-ucitavanje">Учитавам постове...</div></div>
    <div class="biblio-dno">
      <button class="dug" id="dugOsvezi">Освежи блог</button>
      <button class="dug" id="dugUnesi">Унеси свој текст</button>
      <button class="dug" id="dugFajl">Отвори .txt фајл</button>
      <input type="file" id="fajl" accept=".txt,text/plain" hidden>
      <button class="dug" id="dugTema">Промени тему</button>
    </div>
  </aside>

  <!-- ================= ГЛАВНО ОКНО ================= -->
  <div class="glavno-okno">

    <div class="alatke">
      <div class="grupa">
        <label for="brzina">Брзина</label>
        <input type="range" id="brzina" min="100" max="1200" step="25" value="100">
        <span class="brzina-broj" id="brzinaBroj">100</span>
      </div>
      <div class="grupa">
        <label for="grupisanje">Речи одједном</label>
        <select id="grupisanje">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="grupa">
        <label for="rezim">Приказ</label>
        <select id="rezim">
          <option value="rezim-oba" selected>Подељено</option>
          <option value="rezim-tekst">Цео текст</option>
          <option value="rezim-fokus">Само фокус</option>
        </select>
      </div>
      <div class="grupa">
        <label for="pauze">Паузе</label>
        <input type="checkbox" id="pauze" checked>
      </div>
      <div class="naslov-tekuci" id="naslovTekuci">Учитавање постова...</div>
    </div>

    <section class="fokus">
      <div class="merilo">
        <div class="red" id="red">
          <span class="l" id="fL"></span><span class="p" id="fP"></span><span class="r" id="fR"></span>
        </div>
      </div>
    </section>

    <section class="citaonica" id="citaonica">
      <div class="tekst" id="tekst"></div>
    </section>

    <footer class="podnozje">
      <div class="svirac">
        <button class="dug" id="dugNazad" title="Уназад (←)">←</button>
        <button class="dug glavno" id="dugPusti" title="Пусти / стани (размак)">Пусти</button>
        <button class="dug" id="dugNapred" title="Унапред (→)">→</button>
        <button class="dug" id="dugPocetak" title="Испочетка (R)">⟲</button>
      </div>
      <input type="range" class="traka" id="traka" min="0" max="0" value="0">
      <div class="stanje" id="stanje">—</div>
    </footer>

  </div>
</div>

<!-- ================= УНОС ТЕКСТА ================= -->
<div class="zavesa" id="zavesa">
  <div class="prozor">
    <h2>Нови текст</h2>
    <input type="text" id="noviNaslov" placeholder="Наслов">
    <textarea id="noviTekst" placeholder="Налепи текст овде…"></textarea>
    <div class="pomoc">Сачувани текстови остају у овом прегледачу. За трајну базу их објави на блогу.</div>
    <div class="red-dugmadi">
      <button class="dug" id="dugOtkazi">Одустани</button>
      <button class="dug" id="dugSamoCitaj">Само читај</button>
      <button class="dug glavno" id="dugSacuvaj">Сачувај и читај</button>
    </div>
  </div>
</div>

<script>
/* ================= ПОДЕШАВАЊА ================= */
var PODESAVANJA = {
  blog: "https://brzocitac.blogspot.com",  // Унеси URL свог блога овде (нпр. "https://mojblog.blogspot.com")
  oznaka: "",            // читај само постове с овом ознаком, нпр. "читање". "" = сви постови
  maxPostova: 100,       // колико последњих постова да повуче
  minReci: 30            // прескочи постове краће од овог броја речи
};
/* ============================================== */

(function(){
"use strict";

/* ---------------- помоћно ---------------- */
var $ = function(s){ return document.querySelector(s); };
var ostava = {
  uzmi: function(k,p){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):p; }catch(e){ return p; } },
  stavi: function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- стање ---------------- */
var ugradjeni = [];   // постови са блога
var moji      = ostava.uzmi("brzocitac.moji", []);
var napredak  = ostava.uzmi("brzocitac.napredak", {});

var reci = [];        // низ речи текућег текста
var polja = [];       // одговарајући <span> елементи
var i = 0;            // индекс текуће речи
var radi = false;
var tajmer = null;
var tekuciId = null;
var oznaceno = [-1,-1];

var brzina = ostava.uzmi("brzocitac.brzina2", 100);
var grupa  = ostava.uzmi("brzocitac.grupa2", 2);
var rezim  = ostava.uzmi("brzocitac.rezim", "rezim-oba");
var pauze  = ostava.uzmi("brzocitac.pauze", true);
var tema   = ostava.uzmi("brzocitac.tema", "tamno");

/* ---------------- повлачење постова (JSONP) ---------------- */
var brojacPoziva = 0;

function feedURL(pocetak, imeF){
  var osnova = (PODESAVANJA.blog || "").replace(/\/\/+$/, "");
  var put = "/feeds/posts/default";
  if (PODESAVANJA.oznaka) put += "/-/" + encodeURIComponent(PODESAVANJA.oznaka);
  return osnova + put + "?alt=json-in-script&max-results=25&start-index=" + pocetak + "&callback=" + imeF;
}

function uCistTekst(html){
  var t = String(html)
    .replace(/<(script|style|noscript|iframe)[\s\S]*?<\/>/gi, "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|h[1-6]|blockquote|tr)>/gi, "\n\n")
    .replace(/<[^>]+>/g, "");
  var d = document.createElement("div");
  d.innerHTML = t;
  return d.textContent
    .replace(/ /g, " ")
    .replace(/[ 	]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function povuci(pocetak, skup, gotovo){
  var ime = "__bcFeed" + (brojacPoziva++);
  var s = document.createElement("script");
  var zavrseno = false;

  window[ime] = function(json){
    zavrseno = true;
    try{ delete window[ime]; }catch(e){ window[ime] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);

    var ulazi = (json && json.feed && json.feed.entry) || [];
    ulazi.forEach(function(e){
      var html = (e.content && e.content.$t) || (e.summary && e.summary.$t) || "";
      var tekst = uCistTekst(html);
      if (tekst.split(/\s+/).length < PODESAVANJA.minReci) return;
      var datum = e.published && e.published.$t ? new Date(e.published.$t) : null;
      skup.push({
        id: (e.id && e.id.$t ? e.id.$t.replace(/^.*post-/, "post-") : "post-" + skup.length),
        naslov: (e.title && e.title.$t) || "Без наслова",
        autor: datum ? datum.toLocaleDateString("sr-RS") : "",
        tekst: tekst
      });
    });

    if (ulazi.length === 25 && skup.length < PODESAVANJA.maxPostova)
      povuci(pocetak + 25, skup, gotovo);
    else
      gotovo(skup, null);
  };

  s.src = feedURL(pocetak, ime);
  s.onerror = function(){ if (!zavrseno) gotovo(skup, "veza"); };
  document.head.appendChild(s);
  setTimeout(function(){ if (!zavrseno) gotovo(skup, "vreme"); }, 15000);
}

function ucitajPostove(){
  $("#lista").innerHTML = '<div class="poruka-ucitavanje">Учитавам постове...</div>';
  povuci(1, [], function(skup, greska){
    if (!skup.length){
      $("#lista").innerHTML = '<div class="poruka-ucitavanje">Ниједан пост није учитан. Провери подешавања блога.</div>';
      return;
    }
    ugradjeni = skup;
    ostava.stavi("brzocitac.kes", { kad: Date.now(), postovi: skup });
    nacrtajListu();
    if (!tekuciId) ucitaj(ugradjeni[0].id);
  });
}

/* ---------------- библиотека ---------------- */
function sviTekstovi(){ return ugradjeni.concat(moji); }

function nacrtajListu(){
  var l = $("#lista"); l.innerHTML = "";
  sviTekstovi().forEach(function(t){
    var d = document.createElement("button");
    d.className = "stavka" + (t.id === tekuciId ? " aktivna" : "");
    var brRec = t.tekst.trim().split(/\s+/).length;
    var opis = (t.autor ? t.autor + " · " : "") + brRec + " речи";
    var p = napredak[t.id];
    if (p && p > 0) opis += " · " + Math.round(p / brRec * 100) + "%";
    d.innerHTML = '<span class="n">' + esc(t.naslov) + '</span><span class="m">' + esc(opis) + '</span>';
    d.onclick = function(){ ucitaj(t.id); };
    if (t.moj){
      var x = document.createElement("button");
      x.className = "x"; x.textContent = "✕"; x.title = "Обриши";
      x.onclick = function(e){
        e.stopPropagation();
        if(!confirm("Обрисати „" + t.naslov + "“?")) return;
        moji = moji.filter(function(m){ return m.id !== t.id; });
        ostava.stavi("brzocitac.moji", moji);
        nacrtajListu();
      };
      d.insertBefore(x, d.firstChild);
    }
    l.appendChild(d);
  });
}

/* ---------------- припрема текста ---------------- */
function pripremi(tekst){
  var pasusi = tekst.replace(/\r\n/g, "\n").trim().split(/\n{2,}/);
  reci = [];
  var html = "";
  pasusi.forEach(function(p){
    var redovi = p.split(/\n/);
    var pasusHtml = "<p>";
    var imaNesto = false;
    
    redovi.forEach(function(red, idx){
      var t = red.split(/\s+/).filter(Boolean);
      if (t.length > 0) {
        imaNesto = true;
        t.forEach(function(r){
          pasusHtml += '<span class="rec" data-i="' + reci.length + '">' + esc(r) + "</span> ";
          reci.push(r);
        });
        // Dodajemo <br> za ocuvanje obicnog (jednostrukog) novog reda
        if (idx < redovi.length - 1) {
          pasusHtml += "<br>";
        }
      }
    });
    
    pasusHtml += "</p>";
    if (imaNesto) {
      html += pasusHtml;
    }
  });
  
  $("#tekst").innerHTML = html;
  polja = Array.prototype.slice.call($("#tekst").querySelectorAll(".rec"));
  oznaceno = [-1,-1];
}

function ucitaj(id, privremeni){
  stani();
  var t = privremeni || sviTekstovi().filter(function(x){ return x.id === id; })[0];
  if (!t) return;
  tekuciId = t.id;
  $("#naslovTekuci").textContent = t.naslov;
  pripremi(t.tekst);
  i = privremeni ? 0 : Math.min(napredak[t.id] || 0, reci.length - 1);
  $("#traka").max = Math.max(0, reci.length - 1);
  postavi(i, true);
  nacrtajListu();
}

/* ---------------- приказ ---------------- */
function postavi(novi, skoci){
  if (!reci.length) return;
  i = Math.max(0, Math.min(novi, reci.length - 1));
  var kraj = Math.min(i + grupa, reci.length);
  var deo = reci.slice(i, kraj);

  // цео текст
  if (skoci){
    polja.forEach(function(s, k){
      s.className = "rec" + (k < i ? " procitana" : "");
    });
  } else {
    for (var k = oznaceno[0]; k < oznaceno[1]; k++)
      if (polja[k]) polja[k].className = "rec procitana";
  }
  for (var k2 = i; k2 < kraj; k2++)
    if (polja[k2]) polja[k2].className = "rec tekuca";
  oznaceno = [i, kraj];
  pomeri(polja[i], skoci);

  // фокус
  crtajFokus(deo);

  $("#traka").value = i;
  stanje();
}

function crtajFokus(deo){
  var red = $("#red");
  if (deo.length === 1){
    var r = deo[0], n = r.length, t;
    if (n <= 1) t = 0; else if (n <= 5) t = 1; else if (n <= 9) t = 2; else t = 3;
    red.className = "red";
    red.innerHTML = '<span class="l"></span><span class="p"></span><span class="r"></span>';
    red.children[0].textContent = r.slice(0, t);
    red.children[1].textContent = r.slice(t, t + 1);
    red.children[2].textContent = r.slice(t + 1);
  } else {
    red.className = "red grupa-rec";
    red.textContent = deo.join(" ");
  }
}

function pomeri(el, odmah){
  if (!el) return;
  var c = $("#citaonica");
  var vrh = el.offsetTop;
  var rel = vrh - c.scrollTop;
  if (odmah || rel < c.clientHeight * 0.2 || rel > c.clientHeight * 0.55){
    c.scrollTop = vrh - c.clientHeight * 0.35;
  }
}

function stanje(){
  if (!reci.length){ $("#stanje").textContent = "—"; return; }
  var preostalo = (reci.length - i) / brzina;
  var min = Math.floor(preostalo), sek = Math.round((preostalo - min) * 60);
  $("#stanje").textContent = (i + 1) + " / " + reci.length + "  ·  преостало "
    + min + ":" + (sek < 10 ? "0" : "") + sek;
}

/* ---------------- ритам ---------------- */
function trajanje(deo){
  var t = 60000 / brzina * deo.length;
  var spoj = deo.join(" ");
  var slova = spoj.replace(/[^\p{L}\p{N}]/gu, "").length;
  if (slova / deo.length > 8) t *= 1.18;
  if (pauze){
    if (/[.!?…»"”]$/.test(spoj)) t *= 2.0;
    else if (/[,;:–—)]$/.test(spoj)) t *= 1.45;
  }
  return t;
}

function korak(){
  if (i >= reci.length){ stani(); return; }
  postavi(i, false);
  var deo = reci.slice(i, Math.min(i + grupa, reci.length));
  tajmer = setTimeout(function(){
    if (!radi) return;
    var sledeci = i + grupa;
    if (sledeci >= reci.length){ stani(); return; }
    i = sledeci;
    korak();
  }, trajanje(deo));
}

function pusti(){
  if (radi || !reci.length) return;
  radi = true;
  $("#dugPusti").textContent = "Стани";
  korak();
}
function stani(){
  radi = false;
  clearTimeout(tajmer);
  $("#dugPusti").textContent = "Пусти";
  zapamti();
}
function prekidac(){ radi ? stani() : pusti(); }

function zapamti(){
  if (tekuciId){ napredak[tekuciId] = i; ostava.stavi("brzocitac.napredak", napredak); }
}

/* ---------------- контроле ---------------- */
$("#dugPusti").onclick = prekidac;
$("#dugNapred").onclick = function(){ postavi(i + grupa, false); };
$("#dugNazad").onclick  = function(){ postavi(i - grupa, false); };
$("#dugPocetak").onclick = function(){ stani(); postavi(0, true); };
$("#dugOsvezi").onclick = function(){ ostava.stavi("brzocitac.kes", null); ucitajPostove(); };

$("#traka").oninput = function(){ postavi(parseInt(this.value, 10), true); };

$("#brzina").oninput = function(){
  brzina = parseInt(this.value, 10);
  $("#brzinaBroj").textContent = brzina;
  ostava.stavi("brzocitac.brzina2", brzina);
  stanje();
};
$("#grupisanje").onchange = function(){
  grupa = parseInt(this.value, 10);
  ostava.stavi("brzocitac.grupa2", grupa);
  postavi(i, true);
};
$("#rezim").onchange = function(){
  document.body.classList.remove("rezim-oba", "rezim-tekst", "rezim-fokus");
  document.body.classList.add(this.value);
  rezim = this.value;
  ostava.stavi("brzocitac.rezim", rezim);
  postavi(i, true);
};
$("#pauze").onchange = function(){
  pauze = this.checked;
  ostava.stavi("brzocitac.pauze", pauze);
};
$("#dugTema").onclick = function(){
  tema = (tema === "tamno") ? "svetlo" : "tamno";
  document.body.classList.toggle("svetlo", tema === "svetlo");
  ostava.stavi("brzocitac.tema", tema);
};

$("#tekst").onclick = function(e){
  var c = e.target.closest(".rec");
  if (!c) return;
  postavi(parseInt(c.dataset.i, 10), false);
};

document.addEventListener("keydown", function(e){
  var u = document.activeElement;
  if (u && (u.tagName === "TEXTAREA" || u.tagName === "INPUT" && u.type === "text")) return;
  if (e.key === " "){ e.preventDefault(); prekidac(); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); postavi(i + grupa, false); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); postavi(i - grupa, false); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); $("#brzina").value = Math.min(1200, brzina + 25); $("#brzina").oninput.call($("#brzina")); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); $("#brzina").value = Math.max(100, brzina - 25); $("#brzina").oninput.call($("#brzina")); }
  else if (e.key === "r" || e.key === "R" || e.key === "р" || e.key === "Р"){ stani(); postavi(0, true); }
  else if (e.key === "Escape"){ zatvori(); }
});

/* ---------------- унос текста ---------------- */
function otvori(){ $("#zavesa").classList.add("otvorena"); $("#noviNaslov").focus(); }
function zatvori(){ $("#zavesa").classList.remove("otvorena"); }
$("#dugUnesi").onclick = otvori;
$("#dugOtkazi").onclick = zatvori;
$("#zavesa").onclick = function(e){ if (e.target === this) zatvori(); };

function odCega(){
  var t = $("#noviTekst").value.trim();
  if (!t){ alert("Поље за текст је празно."); return null; }
  return {
    id: "moj-" + Date.now(),
    naslov: $("#noviNaslov").value.trim() || t.slice(0, 40) + "…",
    autor: "мој текст",
    tekst: t,
    moj: true
  };
}
$("#dugSacuvaj").onclick = function(){
  var t = odCega(); if (!t) return;
  moji.push(t); ostava.stavi("brzocitac.moji", moji);
  zatvori(); nacrtajListu(); ucitaj(t.id);
  $("#noviNaslov").value = ""; $("#noviTekst").value = "";
};
$("#dugSamoCitaj").onclick = function(){
  var t = odCega(); if (!t) return;
  zatvori(); ucitaj(null, t);
};

$("#dugFajl").onclick = function(){ $("#fajl").click(); };
$("#fajl").onchange = function(){
  var f = this.files[0]; if (!f) return;
  var c = new FileReader();
  c.onload = function(){
    ucitaj(null, { id: "fajl-" + Date.now(), naslov: f.name.replace(/\.txt$/i, ""), tekst: String(c.result) });
  };
  c.readAsText(f, "UTF-8");
  this.value = "";
};

window.addEventListener("beforeunload", zapamti);

/* ---------------- почетак ---------------- */
document.body.className = rezim;
if (tema === "svetlo") document.body.classList.add("svetlo");
$("#brzina").value = brzina; $("#brzinaBroj").textContent = brzina;
$("#grupisanje").value = grupa;
$("#rezim").value = rezim;
$("#pauze").checked = pauze;

var kes = ostava.uzmi("brzocitac.kes", null);
if (kes && kes.postovi && kes.postovi.length && (Date.now() - kes.kad) < 6 * 3600 * 1000){
  ugradjeni = kes.postovi;
  nacrtajListu();
  if (sviTekstovi().length) ucitaj(sviTekstovi()[0].id);
}
ucitajPostove();

})();
</script>
</body>
</html>
