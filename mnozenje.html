<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица множења</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .nav-btn {
            background-color: #c8d6e5;
            color: #2f3640;
            font-size: 1.2em;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .nav-btn.active {
            background-color: #ff9f43;
            color: white;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #ff6b6b;
            margin-bottom: 20px;
            font-size: 2.2em;
        }
        
        /* Секција за вежбање */
        #vezba-sekcija {
            display: block;
        }
        .question {
            font-size: 4em;
            font-weight: bold;
            color: #4ecdc4;
            margin-bottom: 30px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #feca57;
            color: #2d3436;
            font-size: 2em;
            padding: 20px;
            border: 4px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
            font-weight: bold;
        }
        .option-btn:hover {
            background-color: #ff9f43;
        }
        .option-btn:active {
            transform: scale(0.95);
        }
        .option-btn.correct-anim {
            background-color: #1dd1a1;
            color: white;
        }
        .option-btn.wrong-anim {
            background-color: #ff6b6b;
            color: white;
        }
        .message {
            margin-top: 10px;
            font-size: 1.5em;
            font-weight: bold;
            height: 35px;
        }
        .correct { color: #1dd1a1; }
        .incorrect { color: #ff6b6b; }
        .score {
            margin-top: 20px;
            font-size: 1.5em;
            color: #576574;
            font-weight: bold;
        }

        /* Секција за преглед таблице */
        #pregled-sekcija {
            display: none;
        }
        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            text-align: left;
        }
        .table-card {
            background-color: #f8f9fa;
            border: 2px solid #c8d6e5;
            border-radius: 10px;
            padding: 15px;
        }
        .table-card h3 {
            margin: 0 0 10px 0;
            color: #5f27cd;
            text-align: center;
            border-bottom: 2px solid #c8d6e5;
            padding-bottom: 5px;
        }
        .table-card p {
            margin: 4px 0;
            font-size: 1.1em;
            color: #2d3436;
        }
    </style>
</head>
<body>
    <div class="nav-tabs">
        <button class="nav-btn active" id="btn-vezba" onclick="switchTab('vezba')">🎮 Вежбај</button>
        <button class="nav-btn" id="btn-pregled" onclick="switchTab('pregled')">📚 Преглед таблице</button>
    </div>

    <div class="container">
        
        <!-- Секција за вежбање -->
        <div id="vezba-sekcija">
            <h1>Погоди резултат!</h1>
            <div class="question" id="question">? × ?</div>
            
            <div class="options-grid" id="options-container">
                <!-- Дугмићи се генеришу кроз JS -->
            </div>

            <div class="message" id="message"></div>
            <div class="score">Резултат: <span id="score">0</span></div>
        </div>

        <!-- Секција за преглед -->
        <div id="pregled-sekcija">
            <h1>Таблица множења</h1>
            <div class="table-grid" id="table-container">
                <!-- Табеле се генеришу кроз JS -->
            </div>
        </div>

    </div>

    <script>
        let correctAnswer;
        let score = 0;
        let isWaiting = false;

        // Функција за промену табова
        function switchTab(tab) {
            if (tab === 'vezba') {
                document.getElementById('vezba-sekcija').style.display = 'block';
                document.getElementById('pregled-sekcija').style.display = 'none';
                document.getElementById('btn-vezba').classList.add('active');
                document.getElementById('btn-pregled').classList.remove('active');
            } else {
                document.getElementById('vezba-sekcija').style.display = 'none';
                document.getElementById('pregled-sekcija').style.display = 'block';
                document.getElementById('btn-pregled').classList.add('active');
                document.getElementById('btn-vezba').classList.remove('active');
            }
        }

        // Генерисање прегледа целе таблице
        function generateTableOverview() {
            const container = document.getElementById('table-container');
            let html = '';
            for (let i = 1; i <= 10; i++) {
                html += `<div class="table-card"><h3>Број ${i}</h3>`;
                for (let j = 1; j <= 10; j++) {
                    html += `<p>${i} × ${j} = <b>${i * j}</b></p>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        // Генерисање питања и понуђених одговора
        function generateQuestion() {
            isWaiting = false;
            document.getElementById('message').textContent = '';
            
            const num1 = Math.floor(Math.random() * 10) + 1;
            const num2 = Math.floor(Math.random() * 10) + 1;
            correctAnswer = num1 * num2;
            
            document.getElementById('question').textContent = `${num1} × ${num2}`;
            
            // Генерисање лажних одговора
            let options = new Set([correctAnswer]);
            while (options.size < 4) {
                // Правимо логичне грешке (нпр. множење са суседним бројем) или мале варијације
                let r = Math.random();
                let wrong;
                if (r < 0.33) {
                    wrong = (num1 + 1) * num2; // као да је додао још један
                } else if (r < 0.66) {
                    wrong = num1 * (num2 - 1 > 0 ? num2 - 1 : 2); // као да је заборавио један
                } else {
                    let offset = Math.floor(Math.random() * 5) + 1;
                    wrong = correctAnswer + (Math.random() > 0.5 ? offset : -offset);
                }
                
                if (wrong > 0 && wrong <= 100 && wrong !== correctAnswer) {
                    options.add(wrong);
                }
            }

            // Мешање одговора
            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);
            
            // Искрцавање дугмића
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedAnswer, btnElement) {
            if (isWaiting) return; // Спречава кликтање док се учитава следеће питање
            
            const messageEl = document.getElementById('message');
            
            if (selectedAnswer === correctAnswer) {
                btnElement.classList.add('correct-anim');
                messageEl.textContent = 'Браво! 🎉';
                messageEl.className = 'message correct';
                score += 1;
                document.getElementById('score').textContent = score;
                isWaiting = true;
                setTimeout(generateQuestion, 1200);
            } else {
                btnElement.classList.add('wrong-anim');
                messageEl.textContent = 'Покушај поново! 💪';
                messageEl.className = 'message incorrect';
                
                // Скида црвену боју после пола секунде да дете може опет да проба
                setTimeout(() => {
                    btnElement.classList.remove('wrong-anim');
                    messageEl.textContent = '';
                }, 800);
            }
        }

        // Иницијализација при учитавању
        window.onload = () => {
            generateTableOverview();
            generateQuestion();
        };
    </script>
</body>
</html>
